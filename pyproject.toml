[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "edgeloop-companion"
version = "0.3.0"
license = "AGPL-3.0-only"
description = "Read-only local AI companion for the authoritative EdgeLoop browser engine"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "websockets>=14,<17", "psutil>=6,<9"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.setuptools.packages.find]
include = ["ai_observer*", "companion_ai*"]
